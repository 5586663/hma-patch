name: Build HMA-OSS Patched Zygisk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone upstream HMA-OSS
        run: git clone --recursive -b master https://github.com/frknkrc44/HMA-OSS.git src

      - name: Apply INET_GID crash patch
        run: |
          cd src
          mkdir -p zygote/src/main/java/org/frknkrc44/hma_oss/zygote/hook
          echo '' | base64 -d > zygote/src/main/java/org/frknkrc44/hma_oss/zygote/hook/InetExceptionPatchHook.kt
          echo '' | base64 -d > zygote/src/main/java/org/frknkrc44/hma_oss/zygote/ZygoteEntry.java
          sed -i 's|    packages(ZygoteLoader.PACKAGE_SYSTEM_SERVER)|    packages(ZygoteLoader.PACKAGE_SYSTEM_SERVER)\n    packages(ZygoteLoader.ALL_PACKAGES)|' zygote/build.gradle.kts
          grep -c ALL_PACKAGES zygote/build.gradle.kts
          wc -c zygote/src/main/java/org/frknkrc44/hma_oss/zygote/hook/InetExceptionPatchHook.kt

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build all modules
        run: |
          cd src
          keytool -genkeypair -keystore $PWD/key.jks -alias hma -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname CN=hma-patch
          echo officialBuild=false >> local.properties
          echo storePassword=123456 >> local.properties
          echo keyAlias=hma >> local.properties
          echo keyPassword=123456 >> local.properties
          echo fileDir=$PWD/key.jks >> local.properties
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hma-oss-zygisk-patched
          path: src/**/*ZYGISK*.zip
          if-no-files-found: error
